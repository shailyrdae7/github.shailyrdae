<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thundering Heights - Road Routes</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
        #map { height: 100%; width: 100%; }
        .legend {
            padding: 10px; background: white; border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        .legend i { width: 18px; height: 18px; float: left; margin-right: 8px; opacity: 0.7; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

    <script>
        // Center map on the school area
        var map = L.map('map').setView([43.085, -79.130], 14);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: 'OpenStreetMap'
        }).addTo(map);

        // --- COORDINATES ---
        var school = [43.0795, -79.1415];

        // --- ROUTE GEOMETRY (Manually traced to follow streets) ---

        // ROUTE A (Blue): South down Kalar Rd
        // Follows Kalar Rd from Lundy's Lane area directly to school
        var pathA_Road = [
            [43.0975, -79.1330], // Start: Kalar/Lundy's
            [43.0895, -79.1345], // Stop: Kalar/Thorold Stone
            [43.0850, -79.1360], // Bend in Kalar
            school               // End: School
        ];

        // ROUTE B (Green): Dorchester -> Turn Right -> McLeod -> School
        // This path now has a "Knee" at the intersection to show the turn
        var pathB_Road = [
            [43.0910, -79.1085], // Start: Dorchester Rd
            [43.0850, -79.1090], // Stop: Dorchester South
            [43.0823, -79.1095], // **CORNER**: Dorchester & McLeod Intersection
            [43.0835, -79.1210], // Stop: McLeod near Montrose
            [43.0805, -79.1350], // Waypoint: McLeod Rd
            school               // End: School
        ];

        // ROUTE C (Orange): East along McLeod from Garner Rd
        var pathC_Road = [
            [43.0785, -79.1650], // Start: McLeod West
            [43.0790, -79.1500], // Stop: McLeod West Subdivisions
            school               // End: School
        ];

        // --- DRAWING LINES ---
        // We use standard solid lines now to look like roads
        var roadStyle = { weight: 6, opacity: 0.8, lineJoin: 'round' };

        L.polyline(pathA_Road, {color: 'blue', ...roadStyle}).addTo(map).bindPopup("Route A: Kalar Rd Corridor");
        L.polyline(pathB_Road, {color: 'green', ...roadStyle}).addTo(map).bindPopup("Route B: Dorchester & McLeod Corridor");
        L.polyline(pathC_Road, {color: 'orange', ...roadStyle}).addTo(map).bindPopup("Route C: McLeod West Corridor");

        // --- ADDING MARKERS (Stops) ---
        var markerOptions = { radius: 8, fillColor: "#000", color: "#fff", weight: 1, opacity: 1, fillOpacity: 0.8 };

        // Function to add dots for stops
        function addStops(coords, color, label) {
            coords.forEach((c, index) => {
                // Don't put a dot on the corner turn (index 2 of Route B), only real stops
                // Simple logic: prevent dot on the "Corner" waypoint for Route B
                if(label.includes("Route B") && index === 2) return;

                if (c !== school) {
                    L.circleMarker(c, {...markerOptions, fillColor: color}).addTo(map).bindPopup(label);
                }
            });
        }

        addStops(pathA_Road, 'blue', "Route A Stop");
        addStops(pathB_Road, 'green', "Route B Stop");
        addStops(pathC_Road, 'orange', "Route C Stop");

        // School Marker
        var schoolIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });
        L.marker(school, {icon: schoolIcon}).addTo(map).bindPopup("<b>Thundering Heights School</b>").openPopup();


        // --- LEGEND ---
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend');
            div.innerHTML += '<h4>Road Routes</h4>';
            div.innerHTML += '<i style="background: blue"></i> Kalar Rd<br>';
            div.innerHTML += '<i style="background: green"></i> Dorchester &rarr; McLeod<br>';
            div.innerHTML += '<i style="background: orange"></i> McLeod West<br>';
            return div;
        };
        legend.addTo(map);

    </script>
</body>
</html>
